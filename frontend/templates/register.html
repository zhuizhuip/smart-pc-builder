<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 - 电脑配件智能搭配系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 0% 0%, rgba(37,99,235,0.06), transparent 24%), radial-gradient(circle at 100% 10%, rgba(20,184,166,0.05), transparent 24%), linear-gradient(180deg, #f6f8fc 0%, #eef3ff 100%);
      font-family: 'Noto Sans SC', sans-serif;
    }
    .reg-overlay {
      width: 440px;
      padding: 40px 36px;
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(15,23,42,0.15);
      backdrop-filter: blur(10px);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand p { color: var(--accent-2); font-size: 10px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; margin: 0; }
    .brand h1 { margin: 6px 0 0; font-size: 22px; letter-spacing: -0.04em; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; background: #f8fbff; outline: none; }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
    .btn { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn:hover { opacity: 0.92; }
    .switch { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
    .switch a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .hint { font-size: 12px; color: var(--muted); margin: -6px 0 8px; }
    .err { text-align: center; color: #ef4444; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="reg-overlay">
    <div class="brand">
      <p>Account Workspace</p>
      <h1>创建账号</h1>
    </div>
    <form method="post">
      <div class="field"><label>用户名</label><input type="text" name="username" required minlength="2" maxlength="24" pattern="[一-鿿A-Za-z0-9_]{2,24}" placeholder="支持中英文、数字、下划线，至少 2 个字符" /></div>
      <div class="field"><label>密码</label><input type="password" name="password" required minlength="8" placeholder="至少 8 位，建议包含大小写字母、数字和符号" /></div>
      <p class="hint">密码需至少包含大写字母、小写字母、数字、特殊字符中的三类。</p>
      <button type="submit" class="btn">注册</button>
    </form>
    <p class="switch">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <p class="err">{{ message }}</p>
    {% endfor %}
    {% endif %}
    {% endwith %}
  </div>
</body>
</html>
